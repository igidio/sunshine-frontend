<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SunshineFrontend</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="favicon.ico"
    />
    <script>
      (function () {
        var theme = localStorage.getItem('color-theme');
        if (
          theme === 'dark' ||
          (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <app-root>
      <div class="bg-neutral-primary h-screen w-screen flex justify-center items-center text-body"
        ><span class="duration-300 animate-pulse">Cargando...</span></div
      >
    </app-root>
  </body>
</html>
