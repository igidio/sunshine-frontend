<ui-table
  [fields]="fields"
  [content]="supplierService.suppliers()!"
  [limits]="[10, 20, 50]"
  search
  pagination
  [filters]="[
    {
      name: 'status',
      label: 'Estado',
      options: [
        { label: 'Activo', value: 'active' },
        { label: 'Inactivo', value: 'inactive' },
      ],
    },
  ]"
>
  <div
    class="flex flex-row mb-4 w-full justify-end"
    slot="before"
  >
    <ui-button
      (click)="supplier_drawer_ref()?.open_drawer_create()"
      icon="plus"
      _label="Crear nuevo proveedor"
    />
  </div>
</ui-table>

<supplier-drawer #supplier_drawer />
<supplier-modal #supplier_modal />
