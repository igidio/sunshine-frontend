<form
  autocomplete="off"
  (submit)="on_submit($event)"
>
  <div class="flex flex-col gap-3">
    <div>
      <ui-field
        _label="Nombre del proveedor"
        _id="name"
        [field]="form.name"
        is_error_message_fixed
      >
        <ui-input
          _placeholder="Nombre del proveedor"
          [field]="form.name"
        />
      </ui-field>
    </div>

    <div>
      <ui-field
        _label="Correo electrónico"
        _id="email"
        [field]="form.email"
        is_error_message_fixed
      >
        <ui-input
          _placeholder="Correo electrónico"
          [field]="form.email"
        />
      </ui-field>
    </div>

    <div>
      <ui-field
        _label="Número de teléfono"
        _id="phone_number"
        [field]="form.phone_number"
        is_error_message_fixed
      >
        <ui-input
          _placeholder="Número de teléfono"
          [field]="form.phone_number"
        />
      </ui-field>
    </div>

    <div>
      <ui-field
        _label="Dirección"
        _id="address"
        [field]="form.address"
        is_error_message_fixed
      >
        <ui-input
          _placeholder="Dirección del proveedor"
          [field]="form.address"
        />
      </ui-field>
    </div>
    <div>
      <ui-field
        _label="Descripción"
        _id="description"
        [field]="form.description"
        is_error_message_fixed
      >
        <ui-textarea
          _placeholder="Descripción del proveedor"
          [field]="form.description"
          [rows]="3"
        />
      </ui-field>
    </div>

    @if (supplierService.selected_supplier()?.image_url && keep_image()) {
      <div class="flex flex-col">
        <label
          for="keep_image"
          class="block text-sm font-medium text-heading"
        >
          Imagen del proveedor
        </label>
      </div>
      <div class="flex flex-row gap-2 items-center">
        <ui-image
          [height]="3"
          placeholder="supplier"
          [url]="environment.imagePrefix + supplierService.selected_supplier()?.image_url!"
          is_square
        />
        <ui-button
          variant="ghost"
          (click)="keep_image.set(false)"
        >
          Eliminar imagen
        </ui-button>
      </div>
    } @else {
      <ui-file
        accept="image/*"
        [max_size_in_kb]="500"
        [(file_selected)]="selected_images"
        (file_error)="on_image_error($event)"
        _label="Imagen del proveedor"
        helper="Solo archivos con formato de imagen"
      />
    }
  </div>
</form>
