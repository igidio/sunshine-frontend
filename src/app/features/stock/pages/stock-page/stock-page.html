@if (!stockService.can_manage_stock()) {
  <ui-alert
    _label="No tienes autorización para modificar el stock."
    dismissible
    bordered
    variant="warning"
  />
}

<ui-card
  [header_label]="'Stock de productos'"
  [header_reload]="on_reload"
  [header_revert]="on_revert"
  [header_loading]="stockService.is_loading()"
>
  <stock-table></stock-table>
</ui-card>
