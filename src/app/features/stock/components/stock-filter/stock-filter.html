<div class="flex flex-col max-w-72 gap-4 justify-end">
  <ui-select-menu
    _placeholder="Seleccione un producto"
    [field]="form.product"
    [fetch_options]="get_product_options.bind(this)"
    closable
  />

  <ui-select-menu
    _placeholder="Seleccione un proveedor"
    [field]="form.supplier"
    [fetch_options]="get_supplier_options.bind(this)"
    closable
  />
</div>
