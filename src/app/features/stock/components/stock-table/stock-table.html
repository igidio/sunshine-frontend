<stock-filter />
<ui-datepicker />

<ui-table
  [fields]="fields"
  [content]="movementService.movements()"
  [expandable]="expandable"
  [lock_scroll]="movementService.is_loading()"
  [fetch_on_scroll]="
    movementService.movements()?.is_last_page
      ? undefined
      : movementService.load_more.bind(movementService)
  "
></ui-table>
