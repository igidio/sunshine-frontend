<div class="flex flex-col gap-2 text-body">
  @if (!notes() && !supplier()) {
    <p class="">No hay información adicional</p>
  }

  @if (notes()) {
    <p class=""><b>Notas:</b> {{ notes() }}</p>
  }

  @if (supplier()) {
    <a
      routerLink="/dashboard/supplier"
      [queryParams]="{ search: supplier()?.name }"
      ><b>Proveedor:</b> {{ supplier()?.name }}</a
    >
  }
</div>
