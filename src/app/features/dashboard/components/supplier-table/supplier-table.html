<button (click)="drawerService.open()">Abrir Drawer</button>
<ui-table
  [fields]="fields"
  [content]="supplierService.suppliers()!"
  [sortable]="['id', 'name', 'created_at', 'email', 'created_at']"
  [limits]="[10, 20, 50]"
  search
  pagination
  [filters]="[
    {
      name: 'status',
      label: 'Estado',
      options: [
        { label: 'Activo', value: 'active' },
        { label: 'Inactivo', value: 'inactive' },
      ],
    },
  ]"
/>

<ng-template #delete_content>
  <div>
    <p class="text-base text-body">
      ¿Está seguro que desea eliminar el proveedor
      <b>{{ supplierService.selected_supplier()?.name }}</b
      >?
    </p>
  </div>
</ng-template>
