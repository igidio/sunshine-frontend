<ui-table
  [fields]="fields"
  [data]="supplierService.suppliers()?.data || []"
  [sortable]="['id', 'name', 'created_at', 'email', 'created_at']"
  [limits]="[10, 20, 50]"
  search
  [filters]="[
    {
      name: 'status',
      label: 'Estado',
      options: [
        { label: 'Activo', value: 'active' },
        { label: 'Inactivo', value: 'inactive' },
      ],
    },
  ]"
></ui-table>
