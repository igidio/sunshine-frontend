<div class="justify-between flex flex-col h-full">
  <span class="text-2xl font-bold tracking-tight text-heading mt-4 mb-4 flex items-center gap-2">
    <ui-icon icon="chat_ai"></ui-icon>
    Chat con asistente de IA
  </span>

  <div class="flex flex-col justify-end grow h-[calc(100vh-20rem)]">
    <div
      class="w-full py-4 px-2 flex flex-col overflow-y-auto gap-2 border-t border-default rounded-base bg-neutral-primary"
      #chat_messages_container
    >
      @for (message of chatService.chat_messages(); track message) {
        <div
          chat-bubble
          [side]="message.role"
          [content]="message.content"
        ></div>
      }
    </div>
    <div class="flex flex-row items-center border border-default rounded-bl-base rounded-br-base">
      <input
        type="text"
        class="bg-neutral-secondary-medium border-default-medium text-heading rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body text-xs rounded-e-0 rounded-ss-0 border-0 border-r"
        placeholder="Escribe tu mensaje..."
        required
        #message_input
        (keydown.enter)="send_message()"
      />
      <ui-button
        rounded
        variant="ghost"
        icon="send"
        (click)="send_message()"
      ></ui-button>
    </div>
  </div>
</div>
