<div class="justify-between flex flex-col h-full">
  <span
    class="text-2xl font-bold tracking-tight text-heading mt-4 flex items-center gap-2 border-b pb-4 border-default"
  >
    <ui-icon icon="chat_ai"></ui-icon>
    Chat con asistente de IA
  </span>

  <div class="flex flex-col justify-end grow h-[calc(100vh-20rem)]">
    <div
      class="w-full p-4 px-2 flex flex-col overflow-y-auto gap-2rounded-base bg-neutral-primary"
      #chat_messages_container
    >
      @for (message of chatService.chat_messages(); track message) {
        <chat-bubble
          [side]="message.role"
          [content]="message.content"
        ></chat-bubble>
      }
    </div>
    <chat-input></chat-input>
  </div>
</div>
