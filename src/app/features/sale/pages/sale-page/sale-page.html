<div class="flex flex-row gap-2 mb-4">
  <ui-button
    _label="Nueva venta"
    [variant]="active_view() === 'create' ? 'default' : 'secondary'"
    (click)="set_view('create')"
  />
  <ui-button
    _label="Historial"
    [variant]="active_view() === 'table' ? 'default' : 'secondary'"
    (click)="set_view('table')"
  />
</div>

@if (active_view() === 'create') {
  <div class="flex flex-col md:flex-row w-full gap-4 justify-center relative">
    <ui-card
      header_label="Nueva venta"
      class="w-full md:max-w-200 flex-1"
      [header_revert]="on_refresh_create"
      ><div class="flex flex-row w-full divider-default">
        <sale-create class="flex-1" />
      </div>
    </ui-card>
    <ui-card
      class="flex-1 md:max-w-100 sticky top-20 h-fit"
      [class]="saleCreateService.total() > 0 ? 'opacity-100' : 'opacity-40 pointer-events-none'"
    >
      <sale-result
        class="flex-1"
        (created)="sale_detail_drawer.open($event)"
      />
    </ui-card>
  </div>
} @else {
  <ui-card
    header_label="Historial de ventas"
    class="flex-1"
  >
    <sale-table></sale-table>
  </ui-card>
}

<sale-detail-drawer #sale_detail_drawer />
