<div class="">
  <label class="block text-sm font-medium text-heading mb-2">Productos</label>

  <ui-select-menu
    _placeholder="Buscar producto..."
    [fetch_options]="saleCreateService.fetch_products.bind(this)"
    (valueChange)="saleCreateService.add_product($event)"
  />

  @if (saleCreateService.products().length > 0) {
    <div class="mt-3 space-y-2">
      @for (product of saleCreateService.products(); track product.id) {
        <div
          class="flex items-center gap-2 bg-neutral-secondary-medium border border-default-medium rounded-base px-3 py-2"
        >
          <span class="flex-1 text-sm text-heading">{{ product.name }}</span>
          <span class="text-sm text-body">{{ product.price }} Bs.</span>
          <ui-button
            variant="ghost"
            size="xs"
            icon="close"
            aria-label="Quitar producto"
            (click)="saleCreateService.remove_product(product)"
          />
        </div>
      }
    </div>
  }
</div>
