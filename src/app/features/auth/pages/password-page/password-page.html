@if (is_validating()) {
  <div class="w-full max-w-100 flex mx-auto">
    <ui-card
      unwrap
      class="w-full my-4"
    >
      <div class="flex justify-center items-center py-8">
        <span class="text-body">Validando enlace...</span>
      </div>
    </ui-card>
  </div>
} @else if (is_valid()) {
  <div class="w-full max-w-100 flex mx-auto">
    <ui-card
      unwrap
      class="w-full my-4"
    >
      <password-form [token]="token()!" />
    </ui-card>
  </div>
}
