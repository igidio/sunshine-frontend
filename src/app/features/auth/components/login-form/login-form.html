<div
  class="bg-neutral-primary-soft block min-w-96 py-2 px-6 border border-default rounded-base shadow-xs"
>
  <div class="text-center pb-5 pt-5">
    <span class="text-2xl font-bold tracking-tight text-heading">Ingresa</span>
  </div>

  <form
    autocomplete="off"
    [formGroup]="form"
  >
    <div class="flex flex-col gap-6 mb-6">
      <div>
        <ui-field
          a_label="Nombre de usuario o correo electrónico"
          a_id="username_or_email"
        >
          <ui-input
            a_placeholder="Nombre de usuario o correo electrónico"
            form_control_name="username_or_email"
          />
        </ui-field>
      </div>

      <div>
        <ui-field
          a_label="Contraseña"
          a_id="password"
        >
          <ui-input
            a_type="password"
            a_placeholder="•••••••••"
            form_control_name="password"
          />
        </ui-field>
      </div>

      <ui-checkbox
        a_label="Recuérdame"
        form_control_name="remember_me"
        a_id="remember_me"
      />

      <button
        type="submit"
        class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none"
      >
        Submit
      </button>
    </div>
  </form>
</div>
