<div class="text-center pb-5 pt-5">
  <span class="text-2xl font-bold tracking-tight text-heading">Recuperar contraseña</span>
</div>

<p class="text-body text-center mb-6">
  Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
</p>

<form
  autocomplete="off"
  (submit)="on_submit($event)"
>
  <div class="flex flex-col gap-3 mb-6">
    <ui-field
      _label="Correo electrónico"
      _id="email"
      [field]="form.email"
      is_error_message_fixed
    >
      <ui-input
        _placeholder="tucorreo@ejemplo.com"
        [field]="form.email"
      />
    </ui-field>
  </div>

  <div class="flex flex-col gap-3">
    <ui-button
      _type="submit"
      variant="default"
      size="md"
      block
      [disabled]="is_sending()"
      [_label]="is_sending() ? 'Enviando...' : 'Enviar correo de recuperación'"
    />

    <a
      routerLink="/auth/login"
      class="text-center text-fg-brand underline text-sm"
    >
      Volver al inicio de sesión
    </a>
  </div>
</form>
