<ng-template #invite_modal>
  <div class="items-center max-w-100">
    <invite-form _class="items-center w-100" />
  </div>
</ng-template>

<ng-template #disable_modal>
  <p class="text-gray-500 dark:text-gray-400">
    ¿Estás seguro de que deseas cambiar el estado de este usuario?
  </p>
</ng-template>

<ng-template #permissions_modal>
  <p class="text-gray-500 dark:text-gray-400">Modificar permisos del usuario pendiente...</p>
</ng-template>
