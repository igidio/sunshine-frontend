@if (!treatmentService.can_manage_treatments()) {
  <ui-alert
    _label="No tienes autorización para modificar los servicios."
    dismissible
    bordered
    variant="warning"
  />
}

<ui-card
  _class=""
  header_label="Lista de servicios"
  [header_reload]="on_reload"
  [header_revert]="on_revert"
  [header_loading]="treatmentService.is_loading()"
>
  <treatment-table />
</ui-card>
