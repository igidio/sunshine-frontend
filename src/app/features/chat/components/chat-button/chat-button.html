@if (!chatService.show_chat_window()) {
  <ui-tooltip
    _id="tooltip-chat-button"
    _label="Habla con el asistente de IA"
    placement="bottom"
    [class]="!chatService.show_chat_window() ? 'w-64' : 'w-fit'"
  ></ui-tooltip>
}
<ui-button
  [attr.data-tooltip-target]="'tooltip-chat-button'"
  data-tooltip-placement="left"
  icon="chat_ai"
  size="xl"
  rounded
  (click)="chatService.toggle_chat_window()"
></ui-button>
