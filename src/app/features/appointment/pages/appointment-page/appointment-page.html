<div class="flex flex-row gap-4">
  <ui-card
    [header_label]="'Calendario de citas'"
    class="flex-1"
  >
    <appointment-calendar></appointment-calendar>
  </ui-card>

  <div class="w-70 lg:w-96 sticky top-20 h-fit hidden lg:flex gap-4 flex-col">
    <ui-button
      _label="Añadir nueva cita"
      icon="plus"
      block
      class="max-w-100 w-full self-end"
      (click)="appointment_drawer_ref()?.open_drawer_create()"
    />
    <ui-card [header_label]="'Detalle de la cita'">
      @if (appointmentService.selected_appointment()) {
        <appointment-info></appointment-info>
      } @else {
        <div class="flex flex-col gap-2 items-center text-body opacity-70 py-8 h-64 justify-center">
          <ui-icon
            icon="calendar"
            class="text-4xl"
          />
          <span>Seleccione una cita para ver su detalle</span>
        </div>
      }
    </ui-card>
  </div>
</div>

<appointment-drawer #appointment_drawer />
