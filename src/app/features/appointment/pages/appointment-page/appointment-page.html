<div class="flex flex-row gap-4">
  <ui-card
    [header_label]="'Calendario de citas'"
    class="flex-1"
  >
    <appointment-calendar></appointment-calendar>
  </ui-card>

  <div class="w-96 sticky top-20 h-fit">
    @if (appointmentService.selected_appointment()) {
      <ui-card [header_label]="'Detalle de la cita'">
        <appointment-info></appointment-info>
      </ui-card>
    } @else {
      <div class="flex flex-col gap-2 items-center text-body opacity-70">
        <ui-icon
          icon="calendar"
          class="text-4xl"
        />
        <span>Seleccione una cita para ver su detalle</span>
      </div>
    }
  </div>
</div>
