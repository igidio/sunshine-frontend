<header class="fixed top-4 left-1/2 -translate-x-1/2 z-30 w-full max-w-7xl px-4">
  <nav
    class="flex items-center justify-between rounded-2xl border border-neutral-quaternary bg-neutral-primary/70 px-6 py-3 shadow-lg backdrop-blur-xl transition-all duration-300"
  >
    <a
      routerLink="/"
      class="flex items-center gap-2 text-lg no-underline text-heading"
    >
      <ui-logo></ui-logo>
    </a>

    <ul class="hidden md:flex items-center gap-1">
      @for (item of nav_items()[0]; track item.label) {
        <li>
          @if (item.href) {
            <ui-button
              [routerLink]="item.href"
              variant="ghost"
              size="sm"
              class="text-body hover:text-heading transition-colors duration-200 no-underline"
              [_label]="item.label"
            />
          } @else {
            <ui-button
              (click)="item.on_click?.()"
              variant="ghost"
              size="sm"
              class="text-body hover:text-heading transition-colors duration-200 no-underline"
              [_label]="item.label"
            />
          }
        </li>
      }
    </ul>

    <div class="flex items-center gap-2">
      <ui-mode></ui-mode>
      <ui-button
        routerLink="/auth/login"
        label="Iniciar sesión"
        variant="default"
        size="sm"
        class="hidden sm:inline-flex"
        _label="Ingresar"
      ></ui-button>
      <ui-dropdown
        _id="main-nav-dropdown"
        [items]="nav_items()"
        placement="bottom-end"
        close_after_click
        class="md:hidden"
      >
        <ui-button
          icon="menu"
          variant="ghost"
          size="md"
        />
      </ui-dropdown>
    </div>
  </nav>
</header>

<landing-login-modal />
