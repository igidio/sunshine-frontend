<section class="relative py-24 bg-neutral-primary-soft">
  <div class="max-w-7xl mx-auto px-4">
    <div class="text-center mb-16">
      <span
        scrollReveal
        class="text-xs font-semibold text-fg-brand uppercase tracking-widest"
        >Tienda</span
      >
      <h2
        scrollReveal
        [delay]="'50ms'"
        class="mt-3 text-4xl sm:text-5xl font-extrabold tracking-tight text-heading"
      >
        Productos
        <span class="text-gradient-brand">destacados</span>
      </h2>
      <p
        scrollReveal
        [delay]="'100ms'"
        class="mt-4 max-w-xl mx-auto text-body leading-relaxed"
      >
        Descubre nuestra cuidada selección de productos premium para el cuidado de tu piel y
        bienestar personal.
      </p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      @for (i of [1, 2, 3, 4]; track i) {
        <product-item
          scrollReveal
          [delay]="i * 100 + 'ms'"
        ></product-item>
      }
    </div>

    <div
      scrollReveal
      class="flex justify-center mt-12"
    >
      <ui-button
        routerLink="/products"
        variant="ghost"
      >
        <span class="mr-2">Ver todos los productos</span>
        <ui-icon
          icon="arrow_right"
          class="text-sm transition-transform duration-200 group-hover:translate-x-1"
        ></ui-icon>
      </ui-button>
    </div>
  </div>
</section>
