<section class="relative py-24 bg-neutral-primary-soft">
  <div class="max-w-7xl mx-auto px-4">
    <div class="text-center mb-16">
      <span
        scrollReveal
        class="text-xs font-semibold text-fg-brand uppercase tracking-widest"
        >Encuéntranos</span
      >
      <h2
        scrollReveal
        [delay]="'50ms'"
        class="mt-3 text-4xl sm:text-5xl font-extrabold tracking-tight text-heading"
      >
        Nuestra
        <span class="text-gradient-brand">ubicación</span>
      </h2>
      <p
        scrollReveal
        [delay]="'100ms'"
        class="mt-4 max-w-xl mx-auto text-body leading-relaxed"
      >
        Visítanos en nuestro spa y descubre un espacio diseñado para tu comodidad y bienestar.
      </p>
    </div>

    <div
      scrollReveal
      class="relative rounded-3xl overflow-hidden border border-neutral-quaternary shadow-2xl"
    >
      <div
        class="aspect-21/9 w-full bg-neutral-secondary flex items-center justify-center relative"
      >
        <iframe
          [src]="google_maps_url()"
          class="absolute inset-0 w-full h-full"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
        <div
          class="absolute inset-0 bg-linear-to-t from-black/20 to-transparent pointer-events-none"
        ></div>
        <div
          class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-row gap-4 items-center pointer-events-none bg-neutral-primary-medium rounded-xl px-6 py-3 shadow-xl text-center"
        >
          <span
            class="w-8 h-8 rounded-full bg-(--color-radical-red-500) map-pin-pulse flex items-center justify-center shadow-lg"
          >
            <ui-icon
              icon="location"
              class="text-white text-lg"
            />
          </span>
          <div>
            <p class="text-sm font-semibold text-heading">Sunshine Spa & Estética</p>
            <p class="text-xs text-body-subtle">Calle Principal #123</p>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-12 grid grid-cols-1 sm:grid-cols-3 gap-6">
      <div
        scrollReveal
        class="flex items-start gap-4 rounded-2xl border border-neutral-quaternary bg-neutral-primary-medium p-6 card-lift"
      >
        <span
          class="w-10 h-10 rounded-xl bg-brand-softer flex items-center justify-center shrink-0"
        >
          <ui-icon
            icon="location"
            class="text-xl text-brand"
          />
        </span>
        <div>
          <p class="text-sm font-semibold text-heading">Dirección</p>
          <p class="text-sm text-body-subtle mt-1">Calle Principal #123, Col. Centro, Ciudad</p>
        </div>
      </div>
      <div
        scrollReveal
        [delay]="'100ms'"
        class="flex items-start gap-4 rounded-2xl border border-neutral-quaternary bg-neutral-primary-medium p-6 card-lift"
      >
        <span
          class="w-10 h-10 rounded-xl bg-brand-softer flex items-center justify-center shrink-0"
        >
          <ui-icon
            icon="phone"
            class="text-xl text-brand"
          />
        </span>
        <div>
          <p class="text-sm font-semibold text-heading">Teléfono</p>
          <p class="text-sm text-body-subtle mt-1">+52 (555) 123-4567</p>
        </div>
      </div>
      <div
        scrollReveal
        [delay]="'200ms'"
        class="flex items-start gap-4 rounded-2xl border border-neutral-quaternary bg-neutral-primary-medium p-6 card-lift"
      >
        <span
          class="w-10 h-10 rounded-xl bg-brand-softer flex items-center justify-center shrink-0"
        >
          <ui-icon
            icon="time"
            class="text-xl text-brand"
          />
        </span>
        <div>
          <p class="text-sm font-semibold text-heading">Horario</p>
          <p class="text-sm text-body-subtle mt-1">Lun - Sáb: 9:00 - 19:00</p>
        </div>
      </div>
    </div>
  </div>
</section>
