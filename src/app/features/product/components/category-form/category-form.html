<form
  autocomplete="off"
  (submit)="on_submit($event)"
>
  <div class="flex flex-col gap-3">
    <div>
      <ui-field
        _label="Nombre de la categoria"
        _id="name"
        [field]="form.name"
        is_error_message_fixed
      >
        <ui-input
          _placeholder="Nombre de la categoria"
          [field]="form.name"
        />
      </ui-field>
    </div>

    <div>
      <ui-field
        _label="Descripcion"
        _id="description"
        [field]="form.description"
        is_error_message_fixed
      >
        <ui-textarea
          _placeholder="Descripcion de la categoria"
          [field]="form.description"
          [rows]="3"
        />
      </ui-field>
    </div>
  </div>
</form>
