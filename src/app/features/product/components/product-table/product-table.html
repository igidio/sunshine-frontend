<ui-table
  [fields]="fields"
  [content]="productService.products()"
  [limits]="[10, 20, 50]"
  search
  pagination
  [filters]="[
    {
      name: 'status',
      label: 'Estado',
      options: [
        { label: 'Activo', value: 'active' },
        { label: 'Inactivo', value: 'inactive' },
      ],
      show_value_on_badge: true,
    },
    {
      name: 'category_id',
      label: 'Categoria',
      only_cancellable: true,
      options: [],
    },
  ]"
  [expandable]="expandable"
>
  <div
    class="flex flex-row w-full justify-end"
    slot="before"
  >
    <ui-button
      (click)="product_drawer_ref()?.open_drawer_create()"
      icon="plus"
      _label="Crear nuevo producto"
    />
  </div>
</ui-table>

<product-drawer #product_drawer />
<product-modal #product_modal />
