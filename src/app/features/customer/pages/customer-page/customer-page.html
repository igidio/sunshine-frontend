@if (!customerService.can_manage_customers()) {
  <ui-alert
    _label="No tienes autorización para modificar los clientes."
    dismissible
    bordered
    variant="warning"
  />
}

<ui-card
  _class=""
  header_label="Lista de clientes"
  [header_reload]="on_reload"
  [header_revert]="on_revert"
  [header_loading]="customerService.is_loading()"
>
  <customer-table />
</ui-card>
