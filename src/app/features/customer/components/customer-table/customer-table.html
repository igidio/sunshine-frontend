<ui-table
  [fields]="fields()"
  [content]="customerService.customers()!"
  [limits]="[10, 20, 50]"
  search
  pagination
  [filters]="[
    {
      name: 'status',
      label: 'Estado',
      show_value_on_badge: true,
      options: [
        { label: 'Activo', value: 'active' },
        { label: 'Inactivo', value: 'inactive' },
      ],
    },
  ]"
  [expandable]="expandable_field"
>
  @if (can_manage_customers()) {
    <div
      class="flex flex-row w-full justify-end"
      slot="before"
    >
      <div
        class="flex flex-row mb-4 w-full justify-end"
        slot="before"
      >
        <ui-button
          (click)="customer_drawer_ref()?.open_drawer_create()"
          icon="plus"
          _label="Añadir nuevo cliente"
        />
      </div>
    </div>
  }
</ui-table>

<customer-drawer #customer_drawer />
<customer-modal #customer_modal />
