<button
  [id]="_id()"
  [type]="_type()"
  [class.w-full]="block()"
  class="box-border font-medium leading-5 rounded-base focus:outline-none cursor-pointer focus:ring-4 flex flex-row items-center justify-center transition-colors"
  [ngClass]="[
    variant_classes.class,
    size_classes.text,
    !_label() && icon() ? size_classes.padding_full : size_classes.padding_xy,
    rounded() ? 'rounded-full' : '',
  ]"
>
  @if (icon()) {
    <ui-icon
      [icon]="icon()!"
      [size]="this.size()"
      [class]="!_label() ? 'm-0' : 'me-2'"
    ></ui-icon>
  }
  {{ _label() }}
</button>
