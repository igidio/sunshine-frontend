<input
  [type]="_type()"
  [id]="id"
  [placeholder]="_placeholder()"
  [value]="model().get() ?? ''"
  [readonly]="readonly()"
  (input)="model().set(set_value($event.target!))"
  (blur)="model().touched()"
  class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
  [class]="
    field() && error_message() && field()!().touched()
      ? 'bg-danger-soft! border-danger-subtle! text-fg-danger-strong! focus:ring-danger!  focus:border-danger! placeholder:text-fg-danger-strong!'
      : ''
  "
/>
