<div class="relative">
  <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3 pointer-events-none">
    <ui-icon
      icon="calendar"
      class="text-body"
    />
  </div>
  <input
    #default_datepicker
    type="text"
    [value]="model().get()"
    (changeDate)="update_value()"
    readonly
    class="block w-full ps-9 pe-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand px-3 shadow-xs placeholder:text-body"
    [placeholder]="placeholder()"
    [class]="
      field() && error_message() && field()!().touched()
        ? 'bg-danger-soft! border-danger-subtle! text-fg-danger-strong! focus:ring-danger!  focus:border-danger! placeholder:text-fg-danger-strong!'
        : ''
    "
  />

  @if (can_clear()) {
    <div class="flex justify-end absolute right-2 top-1/2 -translate-y-1/2">
      <ui-button
        icon="close"
        (mousedown)="$event.preventDefault()"
        (click)="clear_selection()"
        size="xs"
        variant="ghost"
      ></ui-button>
    </div>
  }
</div>
